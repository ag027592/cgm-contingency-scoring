<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 920" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="920" fill="#f8fafc"/>
  <text x="24" y="32" font-size="18" font-weight="700" fill="#0f172a">Worked examples - one Answer per score (0 to 3)</text>
  <text x="24" y="54" font-size="12" fill="#64748b">Score the Answer only. The Question sets the scene - do not score the Question.</text>

  <!-- Score 0 -->
  <rect x="24" y="68" width="852" height="188" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="52" cy="96" r="16" fill="#94a3b8"/>
  <text x="52" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">0</text>
  <text x="78" y="92" font-size="14" font-weight="700" fill="#334155">Nothing connects</text>
  <text x="78" y="110" font-size="11" fill="#64748b">General comment - no link to food, activity, glucose, or plans</text>

  <text x="40" y="136" font-size="11" font-weight="700" fill="#475569">Question (context only):</text>
  <text x="40" y="154" font-size="12" fill="#334155">Was there anything you did not like about the health educational videos?</text>
  <rect x="40" y="164" width="820" height="34" rx="6" fill="#fff3e8" stroke="#fdba74"/>
  <text x="52" y="178" font-size="11" font-weight="700" fill="#9a3412">Answer (score this):</text>
  <text x="52" y="192" font-size="12" fill="#334155">No. Everything was good.</text>

  <text x="40" y="222" font-size="11" font-weight="700" fill="#475569">Chain in this Answer:</text>
  <rect x="40" y="228" width="90" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="85" y="243" text-anchor="middle" font-size="10" fill="#94a3b8">Context</text>
  <rect x="138" y="228" width="90" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="183" y="243" text-anchor="middle" font-size="10" fill="#94a3b8">Behavior</text>
  <rect x="236" y="228" width="90" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="281" y="243" text-anchor="middle" font-size="10" fill="#94a3b8">Outcome</text>
  <rect x="334" y="228" width="90" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="379" y="243" text-anchor="middle" font-size="10" fill="#94a3b8">Rule</text>
  <text x="440" y="243" font-size="11" fill="#64748b">None present - do not infer anything not written.</text>

  <!-- Score 1 -->
  <rect x="24" y="268" width="852" height="188" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="52" cy="296" r="16" fill="#64748b"/>
  <text x="52" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="78" y="292" font-size="14" font-weight="700" fill="#334155">Glucose change only</text>
  <text x="78" y="310" font-size="11" fill="#64748b">Outcome mentioned - no cause, no action, no plan</text>

  <text x="40" y="336" font-size="11" font-weight="700" fill="#475569">Question (context only):</text>
  <text x="40" y="354" font-size="12" fill="#334155">Did you notice any changes in your glucose readings this week?</text>
  <rect x="40" y="364" width="820" height="34" rx="6" fill="#fff3e8" stroke="#fdba74"/>
  <text x="52" y="378" font-size="11" font-weight="700" fill="#9a3412">Answer (score this):</text>
  <text x="52" y="392" font-size="12" fill="#334155">My glucose was high one morning.</text>

  <text x="40" y="422" font-size="11" font-weight="700" fill="#475569">Chain in this Answer:</text>
  <rect x="40" y="428" width="90" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="85" y="443" text-anchor="middle" font-size="10" fill="#94a3b8">Context</text>
  <rect x="138" y="428" width="90" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="183" y="443" text-anchor="middle" font-size="10" fill="#94a3b8">Behavior</text>
  <rect x="236" y="428" width="90" height="22" rx="4" fill="#ede9fe" stroke="#8e6cff"/>
  <text x="281" y="443" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">Outcome</text>
  <rect x="334" y="428" width="90" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="379" y="443" text-anchor="middle" font-size="10" fill="#94a3b8">Rule</text>
  <text x="440" y="443" font-size="11" fill="#64748b">Only the glucose result - no "because I ate..." or "so now I will..."</text>

  <!-- Score 2 -->
  <rect x="24" y="468" width="852" height="188" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="52" cy="496" r="16" fill="#8e6cff"/>
  <text x="52" y="501" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="78" y="492" font-size="14" font-weight="700" fill="#334155">Cause and effect, no plan</text>
  <text x="78" y="510" font-size="11" fill="#64748b">Context + behavior + outcome linked - but no rule for next time</text>

  <text x="40" y="536" font-size="11" font-weight="700" fill="#475569">Question (context only):</text>
  <text x="40" y="554" font-size="12" fill="#334155">What do you think caused the high glucose alert?</text>
  <rect x="40" y="564" width="820" height="34" rx="6" fill="#fff3e8" stroke="#fdba74"/>
  <text x="52" y="578" font-size="11" font-weight="700" fill="#9a3412">Answer (score this):</text>
  <text x="52" y="592" font-size="12" fill="#334155">After I drank soda at lunch, my numbers spiked.</text>

  <text x="40" y="622" font-size="11" font-weight="700" fill="#475569">Chain in this Answer:</text>
  <rect x="40" y="628" width="90" height="22" rx="4" fill="#dbeafe" stroke="#4f8ff7"/>
  <text x="85" y="643" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">Context</text>
  <rect x="138" y="628" width="90" height="22" rx="4" fill="#ffedd5" stroke="#ff9f43"/>
  <text x="183" y="643" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">Behavior</text>
  <rect x="236" y="628" width="90" height="22" rx="4" fill="#ede9fe" stroke="#8e6cff"/>
  <text x="281" y="643" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">Outcome</text>
  <rect x="334" y="628" width="90" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="379" y="643" text-anchor="middle" font-size="10" fill="#94a3b8">Rule</text>
  <text x="440" y="643" font-size="11" fill="#64748b">Links action to result - does NOT say what they will do differently.</text>

  <!-- Score 3 -->
  <rect x="24" y="668" width="852" height="188" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="52" cy="696" r="16" fill="#f59e0b"/>
  <text x="52" y="701" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="78" y="692" font-size="14" font-weight="700" fill="#334155">Starting to change</text>
  <text x="78" y="710" font-size="11" fill="#64748b">Rule forming - planning or trying something new based on what they noticed</text>

  <text x="40" y="736" font-size="11" font-weight="700" fill="#475569">Question (context only):</text>
  <text x="40" y="754" font-size="12" fill="#334155">Has wearing the sensor changed anything you plan to do?</text>
  <rect x="40" y="764" width="820" height="34" rx="6" fill="#fff3e8" stroke="#fdba74"/>
  <text x="52" y="778" font-size="11" font-weight="700" fill="#9a3412">Answer (score this):</text>
  <text x="52" y="792" font-size="12" fill="#334155">Walking seems to help my numbers, so I'm going to try it after every meal.</text>

  <text x="40" y="822" font-size="11" font-weight="700" fill="#475569">Chain in this Answer:</text>
  <rect x="40" y="828" width="90" height="22" rx="4" fill="#dbeafe" stroke="#4f8ff7"/>
  <text x="85" y="843" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">Context</text>
  <rect x="138" y="828" width="90" height="22" rx="4" fill="#ffedd5" stroke="#ff9f43"/>
  <text x="183" y="843" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">Behavior</text>
  <rect x="236" y="828" width="90" height="22" rx="4" fill="#ede9fe" stroke="#8e6cff"/>
  <text x="281" y="843" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">Outcome</text>
  <rect x="334" y="828" width="90" height="22" rx="4" fill="#dcfce7" stroke="#35b46b"/>
  <text x="379" y="843" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Rule</text>
  <text x="440" y="843" font-size="11" fill="#64748b">"Going to try" = plan forming - not yet a firm "from now on I always..." (that would be 4).</text>

  <rect x="24" y="872" width="852" height="36" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="450" y="894" text-anchor="middle" font-size="11" fill="#1e40af">Score 4 example is in the chain diagram below (What you will do) - clear personal rule already in place.</text>
</svg>
