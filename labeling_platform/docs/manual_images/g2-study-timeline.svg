<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="Arial, Helvetica, sans-serif">
  <rect width="920" height="620" fill="#f8fafc"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#0f172a">G2 Study - 20-Day CGM Design</text>
  <text x="40" y="66" font-size="13" fill="#64748b">What participants experienced before the interview - and why your scoring task exists.</text>


  <!-- Timeline (wear period only: Day 1 to Day 20) -->
  <line x1="60" y1="118" x2="780" y2="118" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <polygon points="780,118 768,112 768,124" fill="#94a3b8"/>

  <g font-size="12" fill="#475569">
    <line x1="60" y1="106" x2="60" y2="130" stroke="#64748b" stroke-width="2"/>
    <text x="60" y="98" text-anchor="middle" font-weight="700">Day 1</text>

    <line x1="410" y1="106" x2="410" y2="130" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="395" y="98" text-anchor="end" font-weight="700">Day 10</text>
    <text x="425" y="98" text-anchor="start" font-weight="700">Day 11</text>

    <line x1="780" y1="106" x2="780" y2="130" stroke="#64748b" stroke-width="2"/>
    <text x="780" y="98" text-anchor="middle" font-weight="700">Day 20</text>
  </g>

  <rect x="60" y="158" width="350" height="52" rx="8" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
  <text x="235" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">Phase 1 - Days 1-10</text>
  <text x="235" y="198" text-anchor="middle" font-size="12" fill="#4338ca">CGM worn - No high-glucose alerts</text>

  <rect x="420" y="158" width="360" height="52" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="600" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Phase 2 - Days 11-20</text>
  <text x="600" y="198" text-anchor="middle" font-size="12" fill="#166534">CGM worn - Alerts when glucose &gt; 140 mg/dL</text>

  <!-- Phase detail cards -->
  <rect x="40" y="232" width="410" height="112" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="60" y="258" font-size="14" font-weight="700" fill="#1e3a8a">Phase 1 - baseline period</text>
  <text x="60" y="282" font-size="12" fill="#475569">- Participant wears a Dexcom CGM continuously.</text>
  <text x="60" y="302" font-size="12" fill="#475569">- High-glucose alerts are turned off (control period).</text>
  <text x="60" y="322" font-size="12" fill="#475569">- Used as baseline when comparing later glucose patterns.</text>

  <rect x="470" y="232" width="410" height="112" rx="10" fill="#ffffff" stroke="#86efac"/>
  <text x="490" y="258" font-size="14" font-weight="700" fill="#14532d">Phase 2 - feedback period</text>
  <text x="490" y="282" font-size="12" fill="#475569">- Same CGM; participant can see glucose in real time.</text>
  <text x="490" y="302" font-size="12" fill="#475569">- Device alerts when glucose goes above 140 mg/dL.</text>
  <text x="490" y="322" font-size="12" fill="#475569">- This is when learning from feedback may begin.</text>

  <!-- After Day 20 (below wear period, full width - no overlap) -->
  <text x="460" y="358" text-anchor="middle" font-size="18" fill="#fb923c">&#8595;</text>

  <rect x="40" y="368" width="840" height="72" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="60" y="396" font-size="15" font-weight="700" fill="#9a3412">After Day 20 - Retrospective interview (separate from wear days)</text>
  <text x="60" y="418" font-size="12" fill="#475569">Researchers ask what the participant noticed, changed, or learned from CGM feedback.</text>

  <!-- Your task -->
  <text x="460" y="448" text-anchor="middle" font-size="18" fill="#2563eb">&#8595;</text>

  <rect x="40" y="458" width="840" height="118" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="60" y="486" font-size="15" font-weight="700" fill="#1d4ed8">Your task as a scorer</text>
  <text x="60" y="510" font-size="12" fill="#334155">- Read each interview Answer (what the participant actually said).</text>
  <text x="60" y="530" font-size="12" fill="#334155">- Score context, behavior, outcome, and rule links (0-4).</text>
  <text x="60" y="550" font-size="12" fill="#334155">- Measure contingency-sensitive speech, not glucose quality.</text>
  <text x="60" y="568" font-size="12" fill="#64748b">CGM charts are optional context - they do not replace the Answer.</text>

  <rect x="40" y="592" width="840" height="22" rx="6" fill="#f1f5f9"/>
  <text x="460" y="607" text-anchor="middle" font-size="11" fill="#64748b">Interview timing may not align day-by-day with CGM wear - score language only.</text>
</svg>
